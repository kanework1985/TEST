<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- PWA 全螢幕與主畫面設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#050810" />
  <title>Titanium P2P Phone — 雲端分機與視訊手機</title>

  <!-- Tailwind CSS & PeerJS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background: radial-gradient(circle at 20% 15%, #162238 0%, #070b14 55%, #020408 100%);
      color: #f8fafc;
    }

    /* 背景氛圍極光 */
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.32;
      pointer-events: none;
      z-index: 0;
    }

    /* 響應式手機外框：手機/平板直接 100% 滿版無邊框；桌機大螢幕居中滿高 (100dvh) */
    .phone-shell {
      position: relative;
      width: 100vw;
      height: 100dvh;
      background: #070a12;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 10;
    }

    @media (min-width: 520px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .phone-shell {
        width: min(420px, 95vw);
        height: 100dvh;
        max-height: 920px;
        border-left: 1px solid rgba(255, 255, 255, 0.14);
        border-right: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow:
          0 0 80px rgba(0, 0, 0, 0.9),
          0 0 0 1px rgba(56, 189, 248, 0.12);
      }
    }

    /* 動態島 Dynamic Island */
    .dynamic-island {
      height: 30px;
      min-width: 112px;
      background: #000000;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      gap: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.7), inset 0 0 0 0.5px rgba(255,255,255,0.14);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dynamic-island.active {
      min-width: 196px;
      padding: 0 14px;
    }
    .lens-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #38bdf8 0%, #1e1b4b 50%, #000000 85%);
      box-shadow: inset 0 0 2px rgba(255,255,255,0.45);
      shrink: 0;
    }

    /* 等寬數字防跳動 */
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* 玻璃擬態實體感撥號鍵 */
    .dial-btn {
      width: clamp(60px, 17vw, 74px);
      height: clamp(60px, 17vw, 74px);
      margin: 0 auto;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
    }
    .dial-btn:hover {
      background: rgba(255, 255, 255, 0.13);
    }
    .dial-btn:active, .dial-btn.pressed {
      transform: scale(0.9);
      background: rgba(56, 189, 248, 0.28);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
    }

    /* 矮螢幕手機自適應縮放 */
    @media (max-height: 700px) {
      .dial-btn {
        width: 56px;
        height: 56px;
      }
    }

    /* 聲波律動動畫 (固定高度容器防止跳動) */
    @keyframes wavePulse {
      0%, 100% { transform: scaleY(0.28); }
      50% { transform: scaleY(1); }
    }
    .wave-stick {
      width: 4px;
      height: 26px;
      border-radius: 999px;
      background: linear-gradient(180deg, #38bdf8, #818cf8);
      transform-origin: center;
      animation: wavePulse 0.85s ease-in-out infinite;
    }

    /* 來電鈴聲呼吸光圈 */
    @keyframes ringPulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.12); opacity: 0.25; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }
    .ring-halo {
      animation: ringPulse 1.6s ease-in-out infinite;
    }

    /* 視訊濾鏡樣式 */
    .cam-filter-beauty {
      filter: brightness(1.09) contrast(1.04) saturate(1.18);
    }
    .cam-filter-cyber {
      filter: hue-rotate(185deg) saturate(1.5) contrast(1.15);
    }

    /* 隱藏捲軸 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>

  <!-- 背景氛圍光暈 -->
  <div class="ambient-orb w-96 h-96 bg-sky-600 -top-24 -left-24"></div>
  <div class="ambient-orb w-96 h-96 bg-indigo-600 -bottom-24 -right-24"></div>

  <!-- 手機主容器 -->
  <div class="phone-shell" id="phoneShell">

    <!-- 隱藏的遠端音訊播放元素 (用於 WebRTC 語音通話) -->
    <audio id="remoteAudioEl" autoplay playsinline class="hidden"></audio>

    <!-- ==================== 頂部狀態列與動態島 ==================== -->
    <header class="relative z-50 pt-[max(10px,env(safe-area-inset-top))] pb-1.5 px-5 flex items-center justify-between text-xs font-semibold text-white shrink-0">
      <!-- 左側即時時鐘 -->
      <div class="w-16 tabular-nums text-[13px] tracking-tight" id="statusClock">14:13</div>

      <!-- 中央動態島 -->
      <div class="dynamic-island" id="dynamicIsland">
        <div class="flex items-center gap-1.5 overflow-hidden">
          <span id="islandStatusDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="islandStatusText" class="text-[11px] font-medium text-slate-200 truncate tabular-nums">P2P 就緒</span>
        </div>
        <div class="lens-dot shrink-0"></div>
      </div>

      <!-- 右側全螢幕切換鍵與訊號電量 -->
      <div class="w-20 flex items-center justify-end gap-2">
        <button
          onclick="toggleFullScreen()"
          id="fullscreenBtn"
          title="切換全螢幕 (Fullscreen)"
          class="px-2 py-1 rounded-lg bg-white/10 hover:bg-white/20 border border-white/15 text-[10px] font-medium text-sky-300 active:scale-95 transition flex items-center gap-1"
        >
          <span>⛶</span>
          <span id="fsLabel">全螢幕</span>
        </button>
      </div>
    </header>

    <!-- 系統浮動通知 Toast -->
    <div id="osToast" class="absolute top-12 left-1/2 -translate-x-1/2 z-[70] pointer-events-none opacity-0 transition-all duration-300 -translate-y-2">
      <div class="bg-slate-900/95 backdrop-blur-xl border border-white/15 text-white text-xs px-4 py-2 rounded-full shadow-2xl flex items-center gap-2 whitespace-nowrap">
        <span id="toastIcon">✨</span>
        <span id="toastMsg">系統提示</span>
      </div>
    </div>

    <!-- ==================== 主應用畫面區塊 ==================== -->
    <main class="relative flex-1 flex flex-col overflow-hidden">

      <!-- 1. 分頁一：撥號鍵盤 (Keypad Tab) -->
      <section id="view-keypad" class="tab-panel flex-1 flex flex-col justify-between px-5 pt-1 pb-2 overflow-hidden">

        <!-- 頂部：自動配發的「本機專屬 6 碼號碼」膠囊卡片 -->
        <div class="bg-gradient-to-r from-slate-900/90 via-slate-800/80 to-slate-900/90 backdrop-blur-xl border border-white/12 rounded-2xl p-2.5 shadow-lg shrink-0">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-9 h-9 rounded-xl bg-sky-500/20 border border-sky-400/30 flex items-center justify-center text-sky-400 shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
                </svg>
              </div>
              <div class="min-w-0">
                <div class="flex items-center gap-1.5">
                  <span class="text-[10px] uppercase tracking-wider text-slate-400 font-medium">本機專屬號碼</span>
                  <span id="p2pBadge" class="inline-flex items-center gap-1 text-[10px] px-1.5 py-0.2 rounded-full bg-amber-500/20 text-amber-300 border border-amber-400/20">
                    <span id="p2pDot" class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                    <span id="p2pStatusLabel">連線中...</span>
                  </span>
                </div>
                <div class="flex items-baseline gap-2 mt-0.5">
                  <span id="myAssignedNumber" class="text-xl font-extrabold tracking-widest text-white tabular-nums">------</span>
                  <button onclick="regenerateNumber()" title="重新配發隨機號碼" class="text-[10px] text-slate-400 hover:text-sky-300 underline">
                    換號
                  </button>
                </div>
              </div>
            </div>

            <!-- 一鍵複製號碼 & 複製直撥網址 -->
            <div class="flex flex-col gap-1 shrink-0">
              <button
                onclick="copyMyNumber()"
                class="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 active:scale-95 text-[11px] font-medium text-white transition flex items-center justify-center gap-1"
              >
                <span>📋</span>
                <span>複製號碼</span>
              </button>
              <button
                onclick="copyShareCallLink()"
                class="px-2.5 py-1 rounded-lg bg-sky-500/25 hover:bg-sky-500/40 border border-sky-400/30 active:scale-95 text-[11px] font-medium text-sky-200 transition flex items-center justify-center gap-1"
              >
                <span>🔗</span>
                <span>直撥連結</span>
              </button>
            </div>
          </div>
        </div>

        <!-- 中央：對方號碼輸入顯示區 (固定高度防跳動) -->
        <div class="flex flex-col items-center justify-center h-[68px] shrink-0">
          <input
            type="text"
            id="dialDisplay"
            readonly
            placeholder="輸入對方 6 碼號碼"
            class="w-full bg-transparent text-center text-3xl font-bold tracking-[0.18em] text-white placeholder-slate-600 focus:outline-none tabular-nums"
          />
          <div id="dialTargetHint" class="h-4 text-[11px] font-medium text-sky-400 transition-opacity opacity-0">
            測試專線：AI 語音秘書
          </div>
        </div>

        <!-- 12 鍵實體感玻璃擬態撥號盤 -->
        <div class="grid grid-cols-3 gap-x-4 gap-y-2.5 my-auto px-3 max-w-[330px] w-full mx-auto">
          <button class="dial-btn" data-key="1">
            <span class="text-2xl font-medium text-white leading-none">1</span>
            <span class="text-[8px] tracking-widest text-slate-400 mt-1 font-semibold">&nbsp;</span>
          </button>
          <button class="dial-btn" data-key="2">
            <span class="text-2xl font-medium text-white leading-none">2</span>
            <span class="text-[8px] tracking-widest text-slate-400 mt-1 font-semibold">ABC</span>
          </button>
          <button class="dial-btn" data-key="3">
            <span class="text-2xl font-medium text-white leading-none">3</span>
            <span class="text-[8px] tracking-widest text-slate-400 mt-1 font-semibold">DEF</span>
          </button>
          <button class="dial-btn" data-key="4">
            <span class="text-2xl font-medium text-white leading-none">4</span>
            <span class="text-[8px] tracking-widest text-slate-400 mt-1 font-semibold">GHI</span>
          </button>
          <button class="dial-btn" data-key="5">
            <span class="text-2xl font-medium text-white leading-none">5</span>
            <span class="text-[8px] tracking-widest text-slate-400 mt-1 font-semibold">JKL</span>
          </button>
          <button class="dial-btn" data-key="6">
            <span class="text-2xl font-medium text-white leading-none">6</span>
            <span class="text-[8px] tracking-widest text-slate-400 mt-1 font-semibold">MNO</span>
          </button>
          <button class="dial-btn" data-key="7">
            <span class="text-2xl font-medium text-white leading-none">7</span>
            <span class="text-[8px] tracking-widest text-slate-400 mt-1 font-semibold">PQRS</span>
          </button>
          <button class="dial-btn" data-key="8">
            <span class="text-2xl font-medium text-white leading-none">8</span>
            <span class="text-[8px] tracking-widest text-slate-400 mt-1 font-semibold">TUV</span>
          </button>
          <button class="dial-btn" data-key="9">
            <span class="text-2xl font-medium text-white leading-none">9</span>
            <span class="text-[8px] tracking-widest text-slate-400 mt-1 font-semibold">WXYZ</span>
          </button>
          <button class="dial-btn" data-key="*">
            <span class="text-2xl font-medium text-white leading-none">*</span>
          </button>
          <button class="dial-btn" data-key="0">
            <span class="text-2xl font-medium text-white leading-none">0</span>
            <span class="text-[9px] text-slate-400 mt-0.5 font-semibold">+</span>
          </button>
          <button class="dial-btn" data-key="#">
            <span class="text-2xl font-medium text-white leading-none">#</span>
          </button>
        </div>

        <!-- 底部雙撥號與退格控制列 -->
        <div class="grid grid-cols-3 items-center px-3 pt-1 pb-1 max-w-[330px] w-full mx-auto shrink-0">
          <!-- 左側：綠色語音通話鍵 -->
          <div class="flex flex-col items-center gap-1">
            <button
              onclick="handleDialTrigger('audio')"
              title="發起語音通話"
              class="w-15 h-15 w-[62px] h-[62px] rounded-full bg-gradient-to-b from-emerald-400 to-emerald-600 hover:from-emerald-300 hover:to-emerald-500 text-white shadow-lg shadow-emerald-600/35 flex items-center justify-center active:scale-90 transition"
            >
              <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24">
                <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1C10.61 21 3 13.39 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.58a1 1 0 01-.25 1.01l-2.2 2.2z"/>
              </svg>
            </button>
            <span class="text-[10px] text-emerald-400 font-medium">語音通話</span>
          </div>

          <!-- 中央：藍色視訊通話鍵 -->
          <div class="flex flex-col items-center gap-1">
            <button
              onclick="handleDialTrigger('video')"
              title="發起視訊通話"
              class="w-[62px] h-[62px] rounded-full bg-gradient-to-b from-sky-400 to-blue-600 hover:from-sky-300 hover:to-blue-500 text-white shadow-lg shadow-sky-600/35 flex items-center justify-center active:scale-90 transition"
            >
              <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
              </svg>
            </button>
            <span class="text-[10px] text-sky-400 font-medium">視訊通話</span>
          </div>

          <!-- 右側：退格刪除鍵 -->
          <div class="flex flex-col items-center gap-1">
            <button
              id="btnBackspace"
              onclick="backspaceDigit()"
              title="刪除數字"
              class="w-[62px] h-[62px] rounded-full bg-white/5 hover:bg-white/10 text-slate-300 flex items-center justify-center active:scale-90 transition opacity-35 pointer-events-none"
            >
              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" />
              </svg>
            </button>
            <span class="text-[10px] text-slate-500 font-medium">退格</span>
          </div>
        </div>
      </section>

      <!-- 2. 分頁二：通訊錄與測試專線 (Contacts Tab) -->
      <section id="view-contacts" class="tab-panel hidden flex-1 flex flex-col px-5 pt-2 pb-2 overflow-hidden">
        <div class="flex items-center justify-between mb-3 shrink-0">
          <div>
            <h2 class="text-lg font-bold text-white">測試專線與通訊錄</h2>
            <p class="text-[11px] text-slate-400">可單機測試語音/視訊，或輸入好友 6 碼連線</p>
          </div>
          <button onclick="simulateIncomingDemo()" class="px-2.5 py-1.5 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/30 text-amber-300 text-[11px] font-medium active:scale-95 transition">
            🔔 模擬來電
          </button>
        </div>

        <div id="contactsContainer" class="flex-1 overflow-y-auto no-scrollbar space-y-2.5 pr-0.5">
          <!-- 由 JS 動態產生 -->
        </div>
      </section>

      <!-- 3. 分頁三：通話紀錄 (Recents Tab) -->
      <section id="view-recents" class="tab-panel hidden flex-1 flex flex-col px-5 pt-2 pb-2 overflow-hidden">
        <div class="flex items-center justify-between mb-3 shrink-0">
          <h2 class="text-lg font-bold text-white">通話紀錄</h2>
          <button onclick="clearCallLogs()" class="text-xs text-rose-400 hover:text-rose-300 px-2.5 py-1 rounded-lg bg-rose-500/10 transition">
            清空紀錄
          </button>
        </div>

        <div id="recentsContainer" class="flex-1 overflow-y-auto no-scrollbar space-y-2 pr-0.5">
          <!-- 由 JS 動態產生 -->
        </div>
      </section>

      <!-- ==================== 覆蓋層 1：來電接聽彈窗 (Incoming Call Overlay) ==================== -->
      <section id="incomingOverlay" class="hidden absolute inset-0 z-50 bg-slate-950/95 backdrop-blur-2xl flex flex-col justify-between px-6 pt-12 pb-12">
        <div class="flex flex-col items-center text-center mt-6">
          <div class="relative flex items-center justify-center">
            <div class="absolute w-32 h-32 rounded-full bg-sky-500/30 ring-halo"></div>
            <div id="incomingAvatar" class="relative w-24 h-24 rounded-full bg-gradient-to-br from-sky-400 to-indigo-600 border-2 border-white/25 flex items-center justify-center text-4xl shadow-2xl">
              📲
            </div>
          </div>

          <span id="incomingTypeBadge" class="mt-6 px-3 py-1 rounded-full bg-sky-500/20 border border-sky-400/30 text-sky-300 text-xs font-medium">
            P2P 語音來電
          </span>
          <h2 id="incomingCallerName" class="text-2xl font-bold text-white mt-3 tracking-tight">遠端來電者</h2>
          <p id="incomingCallerNumber" class="text-base font-mono text-slate-300 mt-1 tracking-widest tabular-nums">------</p>
        </div>

        <!-- 接聽 / 拒絕按鈕列 -->
        <div class="flex items-center justify-around px-4 mb-4">
          <!-- 紅色掛斷 -->
          <div class="flex flex-col items-center gap-2">
            <button
              onclick="rejectIncomingCall()"
              class="w-16 h-16 rounded-full bg-gradient-to-b from-rose-500 to-red-600 hover:from-rose-400 hover:to-red-500 text-white shadow-xl shadow-rose-600/40 flex items-center justify-center active:scale-90 transition"
            >
              <svg class="w-8 h-8 fill-current rotate-[135deg]" viewBox="0 0 24 24">
                <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1C10.61 21 3 13.39 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.58a1 1 0 01-.25 1.01l-2.2 2.2z"/>
              </svg>
            </button>
            <span class="text-xs text-slate-300 font-medium">拒絕</span>
          </div>

          <!-- 綠色/藍色接聽 -->
          <div class="flex flex-col items-center gap-2">
            <button
              onclick="acceptIncomingCall()"
              id="btnAcceptIncoming"
              class="w-16 h-16 rounded-full bg-gradient-to-b from-emerald-400 to-emerald-600 hover:from-emerald-300 hover:to-emerald-500 text-white shadow-xl shadow-emerald-600/40 flex items-center justify-center active:scale-90 transition animate-bounce"
            >
              <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24">

    let callLogs = [
      { id: 1, name: 'AI 語音秘書 (測試專線)', number: '10086', mode: 'audio', direction: 'outgoing', time: '剛剛', avatar: '🤖' },
      { id: 2, name: '4K 虛擬視訊測試專線', number: '888888', mode: 'video', direction: 'outgoing', time: '今天', avatar: '👩‍🎨' }

    /* ==========================================================================
       2. Web Audio API 音效與語音合成引擎 (DTMF 雙音多頻 + 來電鈴聲 + 撥號音)
       ========================================================================== */
    class TelecomAudioEngine {
      constructor() {
        this.ctx = null;
        this.ringbackTimer = null;
        this.incomingRingTimer = null;
        this.dtmfMap = {
          '1': [697, 1209], '2': [697, 1336], '3': [697, 1477],
          '4': [770, 1209], '5': [770, 1336], '6': [770, 1477],
          '7': [852, 1209], '8': [852, 1336], '9': [852, 1477],
          '*': [941, 1209], '0': [941, 1336], '#': [941, 1477]
        };
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      playDTMF(key) {
        const pair = this.dtmfMap[key];
        if (!pair) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          gain.connect(this.ctx.destination);

          pair.forEach(freq => {
            const osc = this.ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            osc.connect(gain);
            osc.start(now);
            osc.stop(now + 0.15);
          });
        } catch (e) {}
      }

      startRingback() {
        this.stopAllTones();
        const beep = () => {
          try {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.08, now + 0.05);
            gain.gain.setValueAtTime(0.08, now + 0.8);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.9);
            gain.connect(this.ctx.destination);

            [440, 480].forEach(f => {
              const osc = this.ctx.createOscillator();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(f, now);
              osc.connect(gain);
              osc.start(now);
              osc.stop(now + 0.92);
            });
          } catch (e) {}
        };
        beep();
        this.ringbackTimer = setInterval(beep, 2300);
      }

      startIncomingRingtone() {
        this.stopAllTones();
        const melody = () => {
          try {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
            notes.forEach((freq, i) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + i * 0.13);
              gain.gain.setValueAtTime(0.001, now + i * 0.13);
              gain.gain.linearRampToValueAtTime(0.14, now + i * 0.13 + 0.03);
              gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.13 + 0.35);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now + i * 0.13);
              osc.stop(now + i * 0.13 + 0.36);
            });
          } catch (e) {}
        };
        melody();
        this.incomingRingTimer = setInterval(melody, 2000);
      }

      playHangup() {
        this.stopAllTones();
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [480, 340].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.11);
            gain.gain.setValueAtTime(0.1, now + idx * 0.11);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.11 + 0.1);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.11);
            osc.stop(now + idx * 0.11 + 0.11);
          });
        } catch (e) {}
      }

      stopAllTones() {
        if (this.ringbackTimer) { clearInterval(this.ringbackTimer); this.ringbackTimer = null; }
        if (this.incomingRingTimer) { clearInterval(this.incomingRingTimer); this.incomingRingTimer = null; }
      }

      speakChinese(text) {
        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-TW';
            utter.rate = 1.05;
            window.speechSynthesis.speak(utter);
          }
        } catch (e) {}
      }
    }

    const soundEngine = new TelecomAudioEngine();

    /* ==========================================================================
       3. 全域應用程式狀態
       ========================================================================== */
    let myRandomNumber = '';
    let peerInstance = null;
    let isPeerOnline = false;
    let currentMediaCall = null;
    let incomingMediaCall = null;
    let localStream = null;
    let dialedDigits = '';
    let activeSession = null; // { number, name, mode, isSimulated, avatar, themeColor, greeting }
    let callTimerId = null;
    let elapsedSeconds = 0;
    let simAnswerTimer = null;
    let isMicMuted = false;
    let isSpeakerOn = false;
    let isCameraDisabled = false;
    let currentFacing = 'user';
    let filterStage = 0; // 0: 原色, 1: 美顏, 2: 賽博光影
    let pipCornerIdx = 0; // 0: 右上, 1: 左上, 2: 左下, 3: 右下
    let canvasRafId = null;

    /* ==========================================================================
       4. 系統初始化：全螢幕 API、即時時鐘、自動配發 6 碼隨機號碼與 PeerJS
       ========================================================================== */
    function updateClock() {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      document.getElementById('statusClock').textContent = `${hh}:${mm}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Fullscreen API 切換
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          document.getElementById('fsLabel').textContent = '退出';
          showToast('⛶', '已進入全螢幕模式');
        }).catch(() => {
          showToast('📱', '請點擊瀏覽器「加入主畫面」體驗滿版全螢幕');
        });
      } else {
        document.exitFullscreen().then(() => {
          document.getElementById('fsLabel').textContent = '全螢幕';
        }).catch(() => {});
      }
    }

    document.addEventListener('fullscreenchange', () => {
      document.getElementById('fsLabel').textContent = document.fullscreenElement ? '退出' : '全螢幕';
    });

    // Toast 微通知
    let toastTimer = null;
    function showToast(icon, msg) {
      const el = document.getElementById('osToast');
      document.getElementById('toastIcon').textContent = icon;
      document.getElementById('toastMsg').textContent = msg;
      el.classList.remove('opacity-0', '-translate-y-2');
      el.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.add('opacity-0', '-translate-y-2');
        el.classList.remove('opacity-100', 'translate-y-0');
      }, 2400);
    }

    // 生成不重複 6 位隨機號碼 (避免與內建測試專線衝突)
    function generateSixDigitNumber() {
      let num;
      do {
        num = String(Math.floor(100000 + Math.random() * 900000));
      } while (num === '888888');
      return num;
    }

    function initPeerNetwork(assignedNum) {
      myRandomNumber = assignedNum;
      document.getElementById('myAssignedNumber').textContent = myRandomNumber;
      setP2PStatusUI('connecting');

      if (peerInstance) {
        try { peerInstance.destroy(); } catch (e) {}
        peerInstance = null;
      }

      if (typeof Peer === 'undefined') {
        setP2PStatusUI('sandbox');
        return;
      }

      try {
        const fullPeerId = PEER_PREFIX + myRandomNumber;
        peerInstance = new Peer(fullPeerId, {
          debug: 0,
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' }
            ]
          }
        });

        peerInstance.on('open', () => {
          isPeerOnline = true;
          setP2PStatusUI('online');
          checkUrlAutoCallParam();
        });

        // 監聽遠端來電
        peerInstance.on('call', (call) => {
          if (activeSession || incomingMediaCall) {
            call.close();
            return;
          }
          incomingMediaCall = call;
          const callerRawId = call.peer || '';
          const callerNum = callerRawId.startsWith(PEER_PREFIX)
            ? callerRawId.replace(PEER_PREFIX, '')
            : '未知分機';
          const callMode = (call.metadata && call.metadata.mode === 'video') ? 'video' : 'audio';

          showIncomingCallUI(callerNum, callMode, false);
        });

        peerInstance.on('error', (err) => {
          // 若號碼碰撞則自動重抽一組
          if (err && err.type === 'unavailable-id') {
            initPeerNetwork(generateSixDigitNumber());
            return;
          }
          isPeerOnline = false;
          setP2PStatusUI('sandbox');
          checkUrlAutoCallParam();
        });

        peerInstance.on('disconnected', () => {
          isPeerOnline = false;
          setP2PStatusUI('sandbox');
        });
      } catch (e) {
        isPeerOnline = false;
        setP2PStatusUI('sandbox');
        checkUrlAutoCallParam();
      }
    }

    function setP2PStatusUI(state) {
      const badge = document.getElementById('p2pBadge');
      const dot = document.getElementById('p2pDot');
      const label = document.getElementById('p2pStatusLabel');
      const islandText = document.getElementById('islandStatusText');
      const islandDot = document.getElementById('islandStatusDot');

      if (state === 'online') {
        badge.className = 'inline-flex items-center gap-1 text-[10px] px-1.5 py-0.2 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-400/25';
        dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse';
        label.textContent = '線上待命中';
        if (!activeSession) {
          islandDot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
          islandText.textContent = `分機 ${myRandomNumber}`;
        }
      } else if (state === 'connecting') {
        badge.className = 'inline-flex items-center gap-1 text-[10px] px-1.5 py-0.2 rounded-full bg-amber-500/20 text-amber-300 border border-amber-400/20';
        dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse';
        label.textContent = '註冊分機中...';
      } else {
        badge.className = 'inline-flex items-center gap-1 text-[10px] px-1.5 py-0.2 rounded-full bg-sky-500/20 text-sky-300 border border-sky-400/25';
        dot.className = 'w-1.5 h-1.5 rounded-full bg-sky-400';
        label.textContent = '單機測試就緒';
        if (!activeSession) {
          islandDot.className = 'w-2 h-2 rounded-full bg-sky-400';
          islandText.textContent = `分機 ${myRandomNumber}`;
        }
      }
    }

    function regenerateNumber() {
      if (activeSession) {
        showToast('⚠️', '通話進行中無法更換號碼');
        return;
      }
      const nextNum = generateSixDigitNumber();
      initPeerNetwork(nextNum);
      showToast('🔄', `已配發新號碼：${nextNum}`);
    }

    // 複製文字通用函式 (相容 iFrame 與所有瀏覽器)
    function copyTextFallback(text, successMsg) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('✅', successMsg);
      } catch (err) {
        showToast('📋', text);
      }
      document.body.removeChild(textarea);
    }

    function copyMyNumber() {
      copyTextFallback(myRandomNumber, `已複製本機號碼：${myRandomNumber}`);
    }

    function copyShareCallLink() {
      const url = new URL(window.location.href);
      url.searchParams.set('call', myRandomNumber);
      copyTextFallback(url.toString(), '已複製直撥邀請網址！傳給朋友開啟即可自動撥號');
    }

    // 檢查網址是否帶有 ?call=號碼 參數
    let hasCheckedUrlCall = false;
    function checkUrlAutoCallParam() {
      if (hasCheckedUrlCall) return;
      hasCheckedUrlCall = true;
      const params = new URLSearchParams(window.location.search);
      const targetCall = (params.get('call') || '').replace(/[^0-9*#]/g, '');
      if (targetCall && targetCall !== myRandomNumber) {
        dialedDigits = targetCall;
        refreshDialDisplay();
        showToast('📲', `偵測到直撥連結，準備呼叫 ${targetCall}`);
        setTimeout(() => {
          handleDialTrigger('video');
        }, 900);
      }
    }

    /* ==========================================================================
       5. 撥號鍵盤與分頁切換邏輯
       ========================================================================== */
    function switchMainTab(tabName) {
      document.querySelectorAll('.tab-panel').forEach(el => el.classList.add('hidden'));
      document.getElementById(`view-${tabName}`).classList.remove('hidden');

      document.querySelectorAll('.main-nav-btn').forEach(btn => {
        btn.classList.remove('text-sky-400');
        btn.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`tabBtn-${tabName}`);
      activeBtn.classList.remove('text-slate-400');
      activeBtn.classList.add('text-sky-400');

      if (tabName === 'contacts') renderContactsList();
      if (tabName === 'recents') renderRecentsList();
    }

    function refreshDialDisplay() {
      const display = document.getElementById('dialDisplay');
      const hint = document.getElementById('dialTargetHint');
      const backBtn = document.getElementById('btnBackspace');

      display.value = dialedDigits;

      if (dialedDigits.length > 0) {
        backBtn.classList.remove('opacity-35', 'pointer-events-none');
        backBtn.classList.add('opacity-100');
      } else {
        backBtn.classList.add('opacity-35', 'pointer-events-none');
        backBtn.classList.remove('opacity-100');
      }

      const matched = BUILTIN_LINES.find(item => item.number === dialedDigits);
      if (matched) {
        hint.textContent = `測試專線：${matched.name}`;
        hint.classList.remove('opacity-0');
        hint.classList.add('opacity-100');
      } else if (dialedDigits === myRandomNumber) {
        hint.textContent = '提示：這是您本機的專屬號碼';
        hint.classList.remove('opacity-0');
        hint.classList.add('opacity-100');
      } else if (dialedDigits.length === 6) {
        hint.textContent = 'P2P 跨裝置分機號碼 · 點擊下方按鈕開始通話';
        hint.classList.remove('opacity-0');
        hint.classList.add('opacity-100');
      } else {
        hint.classList.add('opacity-0');
        hint.classList.remove('opacity-100');
      }
    }

    function pressDigit(digit) {
      if (dialedDigits.length >= 12) return;
      dialedDigits += digit;
      soundEngine.playDTMF(digit);
      refreshDialDisplay();
    }

    function backspaceDigit() {
      if (dialedDigits.length === 0) return;
      dialedDigits = dialedDigits.slice(0, -1);
      refreshDialDisplay();
    }

    document.querySelectorAll('.dial-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        pressDigit(btn.getAttribute('data-key'));
      });
    });

    window.addEventListener('keydown', (e) => {
      if (activeSession || incomingMediaCall) return;
      if (/^[0-9*#]$/.test(e.key)) {
        pressDigit(e.key);
        const btn = document.querySelector(`.dial-btn[data-key="${e.key}"]`);
        if (btn) {
          btn.classList.add('pressed');
          setTimeout(() => btn.classList.remove('pressed'), 120);
        }
      } else if (e.key === 'Backspace') {
        backspaceDigit();
      } else if (e.key === 'Enter' && dialedDigits.length > 0) {
        handleDialTrigger('audio');
      }
    });

    function clearCallLogs() {
      callLogs = [];
      renderRecentsList();
      showToast('🗑️', '已清空通話紀錄');
    }

    function quickDialLine(number, mode) {
      dialedDigits = number;
      refreshDialDisplay();
      switchMainTab('keypad');
      handleDialTrigger(mode);
    }

    /* ==========================================================================
       6. 撥出通話與媒體權限取得 (WebRTC 真實連線 + 測試專線降級)
       ========================================================================== */
    async function acquireLocalMedia(wantVideo) {
      stopLocalMedia();
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return null;
        }
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: wantVideo ? { facingMode: currentFacing, width: { ideal: 640 }, height: { ideal: 480 } } : false
        });
        localStream = stream;
        return stream;
      } catch (err) {
        // 若視訊鏡頭被拒絕，嘗試只取麥克風音訊
        if (wantVideo) {
          try {
            const audioOnly = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            localStream = audioOnly;
            return audioOnly;
          } catch (e) {
            return null;
          }
        }
        return null;
      }
    }

    function stopLocalMedia() {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
    }

    // 供 PeerJS 呼叫時必須傳入有效 MediaStream 的靜音/虛擬串流備援
    function createFallbackMediaStream(wantVideo) {
      const tracks = [];
      try {
        soundEngine.init();
        if (soundEngine.ctx) {
          const dest = soundEngine.ctx.createMediaStreamDestination();
          tracks.push(...dest.stream.getAudioTracks());
        }
      } catch (e) {}

      if (wantVideo) {
        const canvas = document.getElementById('localFallbackCanvas');
        if (canvas && canvas.captureStream) {
          const vStream = canvas.captureStream(15);
          tracks.push(...vStream.getVideoTracks());
        }
      }
      return new MediaStream(tracks);
    }

    async function handleDialTrigger(mode) {
      if (!dialedDigits) {
        // 若未輸入號碼，提示並自動填入預設測試專線方便體驗
        dialedDigits = mode === 'video' ? '888888' : '10086';
        refreshDialDisplay();
        showToast('💡', `已自動填入測試專線 ${dialedDigits}`);
      }

      if (dialedDigits === myRandomNumber) {
        showToast('⚠️', '無法撥打給自己的本機號碼');
        return;
      }

      const builtin = BUILTIN_LINES.find(l => l.number === dialedDigits);
      const isBuiltinTest = Boolean(builtin) || !isPeerOnline;

      const sessionInfo = {
        number: dialedDigits,
        name: builtin ? builtin.name : `分機 ${dialedDigits}`,
        mode: mode,
        isSimulated: isBuiltinTest,
        avatar: builtin ? builtin.avatar : '👤',
        themeColor: builtin ? builtin.themeColor : '#38bdf8',
        greeting: builtin
          ? builtin.greeting
          : (isPeerOnline
              ? '正在透過 P2P 加密網路呼叫對方，請稍候...'
              : '目前處於單機展示模式，已為您啟動 AI 模擬通話體驗！')
      };

      await startOutgoingSession(sessionInfo);
    }

    async function startOutgoingSession(info) {
      activeSession = info;
      elapsedSeconds = 0;
      isMicMuted = false;
      isSpeakerOn = false;
      isCameraDisabled = false;
      resetControlButtonStates();

      // 紀錄到通話歷史
      const now = new Date();
      const timeLabel = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      callLogs.unshift({
        id: Date.now(),
        name: info.name,
        number: info.number,
        mode: info.mode,
        direction: 'outgoing',
        time: timeLabel,
        avatar: info.avatar
      });

      // 展開動態島
      const island = document.getElementById('dynamicIsland');
      island.classList.add('active');
      document.getElementById('islandStatusDot').className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
      document.getElementById('islandStatusText').textContent = '正在呼叫...';

      if (info.mode === 'audio') {
        openAudioCallScreen(info);
      } else {
        openVideoCallScreen(info);
      }

      // 取得我方媒體串流
      const realStream = await acquireLocalMedia(info.mode === 'video');
      attachLocalPreviewStream(realStream);

      // 分流：內建測試專線 vs 真實 PeerJS 跨裝置連線
      if (info.isSimulated) {
        soundEngine.startRingback();
        clearTimeout(simAnswerTimer);
        simAnswerTimer = setTimeout(() => {
          if (!activeSession) return;
          soundEngine.stopAllTones();
          onCallConnected(info.greeting);
          soundEngine.speakChinese(info.greeting);
        }, 1800);
      } else {
        // 發起真實 PeerJS WebRTC 呼叫
        soundEngine.startRingback();
        const streamToSend = realStream || createFallbackMediaStream(info.mode === 'video');
        try {
          const call = peerInstance.call(PEER_PREFIX + info.number, streamToSend, {
            metadata: { mode: info.mode, caller: myRandomNumber }
          });
          currentMediaCall = call;

          call.on('stream', (remoteStream) => {
            soundEngine.stopAllTones();
            handleRemoteStream(remoteStream);
            onCallConnected('P2P 加密視訊/語音通道已建立');
          });

          call.on('close', () => {
            if (activeSession) {
              showToast('📴', '對方已結束通話');
              hangupActiveCall();
            }
          });

          call.on('error', () => {
            soundEngine.stopAllTones();
            onCallConnected('對方暫無回應，已自動切換為語音留言模擬');
          });
        } catch (err) {
          soundEngine.stopAllTones();
          onCallConnected('連線異常，已切換為本機模擬模式');
        }
      }
    }

    function handleRemoteStream(remoteStream) {
      if (!remoteStream) return;
      const hasVideoTrack = remoteStream.getVideoTracks().length > 0;
      if (hasVideoTrack) {
        const remoteVid = document.getElementById('remoteVideoEl');
        const remoteCanvas = document.getElementById('remoteVirtualCanvas');
        remoteVid.srcObject = remoteStream;
        remoteVid.classList.remove('hidden');
        remoteCanvas.classList.add('hidden');
      } else {
        const remoteAudio = document.getElementById('remoteAudioEl');
        remoteAudio.srcObject = remoteStream;
      }
    }

    function attachLocalPreviewStream(stream) {
      const localVid = document.getElementById('localVideoEl');
      const fallbackCanvas = document.getElementById('localFallbackCanvas');
      const pipLabel = document.getElementById('localPipLabel');

      if (stream && stream.getVideoTracks().length > 0) {
        localVid.srcObject = stream;
        localVid.classList.remove('hidden');
        fallbackCanvas.classList.add('hidden');
        pipLabel.textContent = currentFacing === 'user' ? '我方前鏡頭' : '我方主鏡頭';
      } else {
        localVid.classList.add('hidden');
        fallbackCanvas.classList.remove('hidden');
        pipLabel.textContent = '我方虛擬化身';
      }
    }

    function onCallConnected(subtitleMsg) {
      document.getElementById('audioStateDot').className = 'w-2 h-2 rounded-full bg-emerald-400';
      document.getElementById('audioSubtitleBox').textContent = subtitleMsg;
      document.getElementById('islandStatusDot').className = 'w-2 h-2 rounded-full bg-emerald-400';
      startDurationTicker();
    }

    function formatClockSec(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function startDurationTicker() {
      clearInterval(callTimerId);
      const updateTimers = () => {
        const t = formatClockSec(elapsedSeconds);
        document.getElementById('audioTimerText').textContent = t;
        document.getElementById('videoTimerText').textContent = `${t} · P2P HD`;
        document.getElementById('islandStatusText').textContent = t;
      };
      updateTimers();
      callTimerId = setInterval(() => {
        elapsedSeconds++;
        updateTimers();
      }, 1000);
    }

    /* ==========================================================================
       7. 來電接聽流程 (真實 P2P 來電 & 模擬來電展示)
       ========================================================================== */
    function simulateIncomingDemo() {
      if (activeSession || incomingMediaCall) return;
      showIncomingCallUI('888888', 'video', true);
    }

    function showIncomingCallUI(callerNumber, mode, isDemo) {
      const builtin = BUILTIN_LINES.find(l => l.number === callerNumber);
      document.getElementById('incomingAvatar').textContent = builtin ? builtin.avatar : '📲';
      document.getElementById('incomingCallerName').textContent = builtin ? builtin.name : `分機 ${callerNumber}`;
      document.getElementById('incomingCallerNumber').textContent = callerNumber;
      document.getElementById('incomingTypeBadge').textContent = mode === 'video' ? '📹 P2P 視訊來電' : '📞 P2P 語音來電';

      const overlay = document.getElementById('incomingOverlay');
      overlay.dataset.callerNumber = callerNumber;
      overlay.dataset.callMode = mode;
      overlay.dataset.isDemo = isDemo ? '1' : '0';
      overlay.classList.remove('hidden');

      soundEngine.startIncomingRingtone();
    }

    async function acceptIncomingCall() {
      const overlay = document.getElementById('incomingOverlay');
      const callerNumber = overlay.dataset.callerNumber;
      const mode = overlay.dataset.callMode || 'audio';
      const isDemo = overlay.dataset.isDemo === '1';

      overlay.classList.add('hidden');
      soundEngine.stopAllTones();

      const builtin = BUILTIN_LINES.find(l => l.number === callerNumber);
      const info = {
        number: callerNumber,
        name: builtin ? builtin.name : `分機 ${callerNumber}`,
        mode: mode,
        isSimulated: isDemo,
        avatar: builtin ? builtin.avatar : '👤',
        themeColor: builtin ? builtin.themeColor : '#34d399',
        greeting: builtin ? builtin.greeting : '已接通 P2P 雙向通話！'
      };

      activeSession = info;
      elapsedSeconds = 0;

      const now = new Date();
      callLogs.unshift({
        id: Date.now(),
        name: info.name,
        number: info.number,
        mode: info.mode,
        direction: 'incoming',
        time: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
        avatar: info.avatar
      });

      document.getElementById('dynamicIsland').classList.add('active');
      if (mode === 'video') {
        openVideoCallScreen(info);
      } else {
        openAudioCallScreen(info);
      }

      const realStream = await acquireLocalMedia(mode === 'video');
      attachLocalPreviewStream(realStream);

      if (incomingMediaCall && !isDemo) {
        const answerStream = realStream || createFallbackMediaStream(mode === 'video');
        incomingMediaCall.answer(answerStream);
        currentMediaCall = incomingMediaCall;
        incomingMediaCall = null;

        currentMediaCall.on('stream', (remoteStream) => {
          handleRemoteStream(remoteStream);
          onCallConnected('已接通 P2P 加密通話');
        });

        currentMediaCall.on('close', () => {
          if (activeSession) hangupActiveCall();
        });
      } else {
        onCallConnected(info.greeting);
        soundEngine.speakChinese(info.greeting);
      }
    }

    function rejectIncomingCall() {
      const overlay = document.getElementById('incomingOverlay');
      const callerNumber = overlay.dataset.callerNumber;
      const mode = overlay.dataset.callMode || 'audio';

      overlay.classList.add('hidden');
      soundEngine.playHangup();

      if (incomingMediaCall) {
        try { incomingMediaCall.close(); } catch (e) {}
        incomingMediaCall = null;
      }

      callLogs.unshift({
        id: Date.now(),
        name: `分機 ${callerNumber}`,
        number: callerNumber,
        mode: mode,
        direction: 'missed',
        time: '剛剛',
        avatar: '📵'
      });
      renderRecentsList();
      showToast('📵', '已拒絕來電');
    }

    /* ==========================================================================
       8. 語音通話與視訊通話畫面切換與控制按鈕
       ========================================================================== */
    function openAudioCallScreen(info) {
      document.getElementById('videoCallScreen').classList.add('hidden');
      const screen = document.getElementById('audioCallScreen');
      screen.classList.remove('hidden');

      document.getElementById('audioAvatar').textContent = info.avatar;
      document.getElementById('audioPeerName').textContent = info.name;
      document.getElementById('audioPeerNumber').textContent = info.number;
      document.getElementById('audioTimerText').textContent = '正在呼叫...';
      document.getElementById('audioStateDot').className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
      document.getElementById('audioSubtitleBox').textContent = '正在建立加密語音通道...';
    }

    function openVideoCallScreen(info) {
      document.getElementById('audioCallScreen').classList.add('hidden');
      const screen = document.getElementById('videoCallScreen');
      screen.classList.remove('hidden');

      document.getElementById('videoPeerName').textContent = info.name;
      document.getElementById('videoModeTag').textContent = info.isSimulated ? '虛擬攝影棚展示' : 'WebRTC 加密視訊';

      // 預設顯示虛擬畫布，若有真實遠端視訊流則由 handleRemoteStream 切換
      document.getElementById('remoteVideoEl').classList.add('hidden');
      document.getElementById('remoteVirtualCanvas').classList.remove('hidden');

      startVirtualVideoRenderer(info);
    }

    async function upgradeToVideoCall() {
      if (!activeSession) return;
      activeSession.mode = 'video';
      openVideoCallScreen(activeSession);
      const stream = await acquireLocalMedia(true);
      attachLocalPreviewStream(stream);
      showToast('📹', '已切換至雙向視訊模式');
    }

    function hangupActiveCall() {
      soundEngine.playHangup();
      clearInterval(callTimerId);
      clearTimeout(simAnswerTimer);
      callTimerId = null;

      if (currentMediaCall) {
        try { currentMediaCall.close(); } catch (e) {}
        currentMediaCall = null;
      }

      stopLocalMedia();
      stopVirtualVideoRenderer();
      activeSession = null;

      document.getElementById('audioCallScreen').classList.add('hidden');
      document.getElementById('videoCallScreen').classList.add('hidden');

      const island = document.getElementById('dynamicIsland');
      island.classList.remove('active');
      setP2PStatusUI(isPeerOnline ? 'online' : 'sandbox');

      renderRecentsList();
      showToast('📴', '通話已結束');
    }

    function resetControlButtonStates() {
      document.getElementById('btnMuteAudio').firstElementChild.classList.remove('bg-white', 'text-slate-900');
      document.getElementById('btnSpeakerAudio').firstElementChild.classList.remove('bg-white', 'text-slate-900');
      document.getElementById('btnVidMic').classList.remove('bg-rose-500');
      document.getElementById('btnVidCam').classList.remove('bg-rose-500');
      document.getElementById('localCamOffOverlay').classList.add('hidden');
    }

    function toggleAudioMute() {
      isMicMuted = !isMicMuted;
      if (localStream) {
        localStream.getAudioTracks().forEach(t => t.enabled = !isMicMuted);
      }
      const iconBox = document.getElementById('btnMuteAudio').firstElementChild;
      if (isMicMuted) {
        iconBox.classList.add('bg-white', 'text-slate-900');
        showToast('🎙️', '麥克風已靜音');
      } else {
        iconBox.classList.remove('bg-white', 'text-slate-900');
        showToast('🎙️', '麥克風已開啟');
      }
    }

    function toggleAudioSpeaker() {
      isSpeakerOn = !isSpeakerOn;
      const iconBox = document.getElementById('btnSpeakerAudio').firstElementChild;
      if (isSpeakerOn) {
        iconBox.classList.add('bg-white', 'text-slate-900');
        showToast('📢', '已切換至擴音器');
      } else {
        iconBox.classList.remove('bg-white', 'text-slate-900');
        showToast('📱', '已切換至聽筒模式');
      }
    }

    function toggleVideoMic() {
      isMicMuted = !isMicMuted;
      if (localStream) {
        localStream.getAudioTracks().forEach(t => t.enabled = !isMicMuted);
      }
      const btn = document.getElementById('btnVidMic');
      if (isMicMuted) {
        btn.classList.add('bg-rose-500');
        showToast('🎙️', '視訊麥克風已靜音');
      } else {
        btn.classList.remove('bg-rose-500');
        showToast('🎙️', '視訊麥克風已開啟');
      }
    }

    function toggleVideoCamera() {
      isCameraDisabled = !isCameraDisabled;
      if (localStream) {
        localStream.getVideoTracks().forEach(t => t.enabled = !isCameraDisabled);
      }
      const btn = document.getElementById('btnVidCam');
      const mask = document.getElementById('localCamOffOverlay');
      if (isCameraDisabled) {
        btn.classList.add('bg-rose-500');
        mask.classList.remove('hidden');
        showToast('📷', '攝影機畫面已關閉');
      } else {
        btn.classList.remove('bg-rose-500');
        mask.classList.add('hidden');
        showToast('📷', '攝影機畫面已開啟');
      }
    }

    async function switchCameraFacing() {
      currentFacing = currentFacing === 'user' ? 'environment' : 'user';
      const localVid = document.getElementById('localVideoEl');
      if (currentFacing === 'user') {
        localVid.classList.add('scale-x-[-1]');
      } else {
        localVid.classList.remove('scale-x-[-1]');
      }
      const stream = await acquireLocalMedia(true);
      attachLocalPreviewStream(stream);
      showToast('🔄', currentFacing === 'user' ? '已切換至前置鏡頭' : '已切換至後置主鏡頭');
    }

    function cycleCamFilter() {
      filterStage = (filterStage + 1) % 3;
      const targets = [
        document.getElementById('localVideoEl'),
        document.getElementById('localFallbackCanvas'),
        document.getElementById('remoteVirtualCanvas')
      ];
      targets.forEach(el => {
        el.classList.remove('cam-filter-beauty', 'cam-filter-cyber');
        if (filterStage === 1) el.classList.add('cam-filter-beauty');
        if (filterStage === 2) el.classList.add('cam-filter-cyber');
      });
      const labels = ['自然原色', 'AI 柔光美顏', '賽博科技光影'];
      showToast('✨', `濾鏡已切換：${labels[filterStage]}`);
    }

    // 點擊子母畫面切換四角位置 (右上 -> 左上 -> 左下 -> 右下)
    function switchPipCorner() {
      const pip = document.getElementById('localPipBox');
      pipCornerIdx = (pipCornerIdx + 1) % 4;
      pip.classList.remove('top-14', 'bottom-28', 'right-4', 'left-4');
      if (pipCornerIdx === 0) pip.classList.add('top-14', 'right-4');
      if (pipCornerIdx === 1) pip.classList.add('top-14', 'left-4');
      if (pipCornerIdx === 2) pip.classList.add('bottom-28', 'left-4');
      if (pipCornerIdx === 3) pip.classList.add('bottom-28', 'right-4');
    }

    /* ==========================================================================
       9. 動態虛擬視訊與備援子母畫面 Canvas 渲染引擎
       ========================================================================== */
    function startVirtualVideoRenderer(info) {
      stopVirtualVideoRenderer();
      const remoteCanvas = document.getElementById('remoteVirtualCanvas');
      const localCanvas = document.getElementById('localFallbackCanvas');
      const rCtx = remoteCanvas.getContext('2d');
      const lCtx = localCanvas.getContext('2d');
      let phase = 0;

      function renderLoop() {
        phase += 0.035;

        if (remoteCanvas.width !== remoteCanvas.clientWidth || remoteCanvas.height !== remoteCanvas.clientHeight) {
          remoteCanvas.width = remoteCanvas.clientWidth || 390;
          remoteCanvas.height = remoteCanvas.clientHeight || 820;
        }
        if (localCanvas.width !== localCanvas.clientWidth || localCanvas.height !== localCanvas.clientHeight) {
          localCanvas.width = localCanvas.clientWidth || 112;
          localCanvas.height = localCanvas.clientHeight || 160;
        }

        // 1. 對方動態虛擬視訊畫面
        const rw = remoteCanvas.width;
        const rh = remoteCanvas.height;
        const grad = rCtx.createLinearGradient(0, 0, rw, rh);
        grad.addColorStop(0, '#090d1a');
        grad.addColorStop(0.5, '#171c36');
        grad.addColorStop(1, '#050811');
        rCtx.fillStyle = grad;
        rCtx.fillRect(0, 0, rw, rh);

        const cx = rw / 2;
        const cy = rh * 0.42 + Math.sin(phase * 1.8) * 6;

        // 呼吸光暈
        const halo = rCtx.createRadialGradient(cx, cy, 12, cx, cy, 170 + Math.sin(phase * 2) * 18);
        halo.addColorStop(0, (info.themeColor || '#38bdf8') + '55');
        halo.addColorStop(1, 'transparent');
        rCtx.fillStyle = halo;
        rCtx.fillRect(0, 0, rw, rh);

        // 動態音浪圓環
        for (let ring = 1; ring <= 2; ring++) {
          rCtx.beginPath();
          rCtx.arc(cx, cy, 68 + ring * 18 + Math.sin(phase * 3 + ring) * 6, 0, Math.PI * 2);
          rCtx.strokeStyle = `rgba(56, 189, 248, ${0.35 / ring})`;
          rCtx.lineWidth = 2;
          rCtx.stroke();
        }

        // 虛擬人物圓盤
        rCtx.beginPath();
        rCtx.arc(cx, cy, 62, 0, Math.PI * 2);
        rCtx.fillStyle = 'rgba(15, 23, 42, 0.88)';
        rCtx.fill();
        rCtx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        rCtx.lineWidth = 2;
        rCtx.stroke();

        rCtx.font = '60px sans-serif';
        rCtx.textAlign = 'center';
        rCtx.textBaseline = 'middle';
        rCtx.fillText(info.avatar || '👩‍🎨', cx, cy + 3);

        // 底部即時聲波條
        const barCount = 16;
        const barW = 4;
        const gap = 5;
        const startX = cx - ((barCount * (barW + gap)) / 2);
        for (let i = 0; i < barCount; i++) {
          const h = 8 + Math.abs(Math.sin(phase * 4 + i * 0.55)) * 24;
          rCtx.fillStyle = '#38bdf8';
          rCtx.beginPath();
          rCtx.roundRect(startX + i * (barW + gap), cy + 105 - h / 2, barW, h, 3);
          rCtx.fill();
        }

        // 2. 我方子母畫面「動態虛擬化身＋即時聲波」備援
        const lw = localCanvas.width;
        const lh = localCanvas.height;
        const lGrad = lCtx.createLinearGradient(0, 0, lw, lh);
        lGrad.addColorStop(0, '#1e293b');
        lGrad.addColorStop(1, '#090d16');
        lCtx.fillStyle = lGrad;
        lCtx.fillRect(0, 0, lw, lh);

        const lcy = lh * 0.4 + Math.cos(phase * 2.2) * 3;
        lCtx.beginPath();
        lCtx.arc(lw / 2, lcy, 26, 0, Math.PI * 2);
        lCtx.fillStyle = 'rgba(56, 189, 248, 0.22)';
        lCtx.fill();

        lCtx.font = '30px sans-serif';
        lCtx.textAlign = 'center';
        lCtx.textBaseline = 'middle';
        lCtx.fillText('😎', lw / 2, lcy + 2);

        // 子母畫面下方迷你聲波
        for (let j = 0; j < 7; j++) {
          const bh = 4 + Math.abs(Math.cos(phase * 4.5 + j * 0.7)) * 12;
          lCtx.fillStyle = isMicMuted ? '#f43f5e' : '#34d399';
          lCtx.fillRect(lw / 2 - 22 + j * 7, lcy + 36 - bh / 2, 3.5, bh);
        }

        canvasRafId = requestAnimationFrame(renderLoop);
      }

      renderLoop();
    }

    function stopVirtualVideoRenderer() {
      if (canvasRafId) {
        cancelAnimationFrame(canvasRafId);
        canvasRafId = null;
      }
    }

    // 啟動初始化
    window.addEventListener('DOMContentLoaded', () => {
      renderContactsList();
      renderRecentsList();
      initPeerNetwork(generateSixDigitNumber());
    });
  </script>
